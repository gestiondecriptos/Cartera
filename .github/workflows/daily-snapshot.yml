name: Snapshot diario

on:
  schedule:
    - cron: '0 6,18 * * *'   # dos veces al día (UTC)
  workflow_dispatch:
    inputs:
      include_partial:
        description: Guardar aunque haya fuentes simuladas (solo para probar)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: history-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calcular y guardar el snapshot
        env:
          INCLUDE_PARTIAL: ${{ inputs.include_partial }}
        run: node scripts/snapshot.mjs
      - name: Subir el histórico
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Snapshot $(date -u +%F-%H%M)"
          git pull --rebase
          git push
